name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-and-tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Check documentation links
        run: python tools/fluxpoint_cli.py check-docs

      - name: Check YAML files
        run: python tools/fluxpoint_cli.py check-config

      - name: Run tool tests
        run: python -m pytest -q tools/tests
